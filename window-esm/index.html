<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browser window ESM migration</title>
<style>
  :root {
    --fg: #15141a; --muted: #6b6b76; --faint: #8f8f9d; --line: #ececf0; --bg-soft: #f7f7f9;
    --fixed: #2ac769; --assigned: #3d8bff; --filed: #ffbd4f; --none: #dcdce2;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--fg); background: #fff; }
  main { max-width: 1100px; margin: 0 auto; padding: 28px 24px 48px; }
  a { color: #0060df; text-decoration: none; }
  a:hover { text-decoration: underline; }
  h1 { font-size: 22px; margin: 0 0 2px; }
  .sub { color: var(--muted); }
  .sub b { color: var(--fg); }
  .error { margin: 14px 0 0; padding: 8px 12px; border-radius: 6px; background: #fff0f0; color: #a4000f; }
  .charts { display: flex; gap: 20px; margin: 18px 0 22px; align-items: stretch; }
  .panel { background: var(--bg-soft); border-radius: 8px; padding: 12px 14px; }
  .burndown { flex: 3; min-width: 0; }
  .burndown svg { width: 100%; height: 170px; display: block; }
  .donut { flex: 1; min-width: 200px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .panel h2 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); margin: 0 0 6px; align-self: flex-start; }
  .legend { display: grid; grid-template-columns: auto auto; gap: 2px 14px; margin-top: 8px; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 12px 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); border-bottom-color: #d7d7de; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.date { white-space: nowrap; color: var(--muted); font-variant-numeric: tabular-nums; }
  code { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .dir { color: var(--faint); }
  .obj { font-weight: 600; }
  .note { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .muted { color: var(--faint); }
  .pill { display: inline-block; padding: 0 8px; border-radius: 10px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .st-fixed { background: #d8f5e2; color: #0d6b33; }
  .st-assigned { background: #deeaff; color: #0047b3; }
  .st-filed { background: #fff4de; color: #8a4a00; }
  .st-none { background: #f0f0f4; color: var(--faint); }
  tr.group td { padding-top: 22px; border-bottom: 1px solid #d7d7de; }
  tr.group code { font-weight: 700; font-size: 14px; }
  .gcount { margin-left: 10px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .gbar { display: inline-flex; width: 90px; height: 6px; margin-left: 8px; border-radius: 3px; overflow: hidden; background: var(--none); vertical-align: middle; }
  .gbar span { display: block; }
  tr.repeat td, tr.repeat a, tr.repeat .dir { color: var(--faint); }
  tr.repeat .obj { font-weight: 400; }
  footer { margin-top: 18px; font-size: 12px; color: var(--faint); }
  @media (max-width: 760px) { .charts { flex-direction: column; } }
</style>
</head>
<body>
<main>
  <h1 id="title">Browser window ESM migration</h1>
  <div class="sub" id="summary">Loading&hellip;</div>
  <div class="error" id="error" hidden></div>

  <div class="charts">
    <div class="panel burndown">
      <h2>Remaining</h2>
      <svg id="burndown" role="img" aria-label="Burndown of remaining items"></svg>
    </div>
    <div class="panel donut">
      <h2>Status</h2>
      <svg id="donut" viewBox="0 0 42 42" width="120" height="120" role="img" aria-label="Status breakdown"></svg>
      <div class="legend" id="legend"></div>
    </div>
  </div>

  <table>
    <thead>
      <tr><th>Item</th><th class="num">Lines</th><th>Bug</th><th>Status</th><th>Assignee</th><th>Fixed</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <footer id="footer"></footer>
</main>

<script>
"use strict";

const BUGZILLA = "https://bugzilla.mozilla.org";
const SEARCHFOX = "https://searchfox.org/firefox-main/source/";
const NOBODY = "nobody@mozilla.org";
const STATES = [
  { key: "fixed", label: "resolved", color: "var(--fixed)" },
  { key: "assigned", label: "assigned", color: "var(--assigned)" },
  { key: "filed", label: "filed", color: "var(--filed)" },
  { key: "none", label: "no bug", color: "var(--none)" },
];
const SORT_ORDER = { assigned: 0, filed: 1, none: 2, fixed: 3 };
const DAY = 24 * 60 * 60 * 1000;

const $ = id => document.getElementById(id);
const esc = s =>
  String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const fmtDate = d => d.toISOString().slice(0, 10);

function classify(bug) {
  if (!bug) {
    return "none";
  }
  if (bug.status == "RESOLVED" || bug.status == "VERIFIED") {
    return "fixed";
  }
  return bug.assigned_to && bug.assigned_to != NOBODY ? "assigned" : "filed";
}

function assigneeName(bug) {
  if (!bug || !bug.assigned_to || bug.assigned_to == NOBODY) {
    return "";
  }
  const d = bug.assigned_to_detail || {};
  return d.nick || d.real_name || bug.assigned_to;
}

async function fetchBugs(ids) {
  if (!ids.length) {
    return new Map();
  }
  const fields = "id,status,resolution,assigned_to,assigned_to_detail,creation_time,cf_last_resolved,summary";
  const url = `${BUGZILLA}/rest/bug?id=${ids.join(",")}&include_fields=${fields}`;
  const response = await fetch(url);
  if (!response.ok) {
    throw new Error(`Bugzilla returned HTTP ${response.status}`);
  }
  const { bugs } = await response.json();
  return new Map(bugs.map(b => [b.id, b]));
}

function renderSummary(data, items) {
  const done = items.filter(i => i.state == "fixed").length;
  const ids = items.filter(i => i.bug).map(i => i.bug);
  const listLink = ids.length
    ? ` &middot; <a href="${BUGZILLA}/buglist.cgi?bug_id=${ids.join(",")}">${ids.length == 1 ? "1 bug" : `all ${ids.length} bugs`} in Bugzilla</a>`
    : "";
  $("summary").innerHTML =
    `Meta <a href="${BUGZILLA}/show_bug.cgi?id=${data.metaBug}">bug ${data.metaBug}</a>` +
    ` &middot; <b>${done} / ${items.length}</b> done${listLink}`;
}

function renderDonut(items) {
  const total = items.length;
  let offset = 0;
  let arcs = "";
  for (const s of STATES) {
    const n = items.filter(i => i.state == s.key).length;
    if (!n) {
      continue;
    }
    const pct = (100 * n) / total;
    arcs +=
      `<circle r="15.915" cx="21" cy="21" fill="none" stroke-width="6" style="stroke:${s.color}"` +
      ` stroke-dasharray="${pct} ${100 - pct}" stroke-dashoffset="${25 - offset}"><title>${s.label}: ${n}</title></circle>`;
    offset += pct;
  }
  const done = items.filter(i => i.state == "fixed").length;
  $("donut").innerHTML =
    arcs + `<text x="21" y="23.3" text-anchor="middle" font-size="6.5" font-weight="700" fill="currentColor">${done}/${total}</text>`;
  $("legend").innerHTML = STATES.map(
    s => `<span><i style="background:${s.color}"></i>${s.label} ${items.filter(i => i.state == s.key).length}</span>`
  ).join("");
}

function renderBurndown(items) {
  const svg = $("burndown");
  const W = svg.clientWidth || 600;
  const H = 170;
  const pad = { l: 34, r: 16, t: 12, b: 24 };
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);

  const total = items.length;
  const now = Date.now();
  const created = items.filter(i => i.bugData).map(i => Date.parse(i.bugData.creation_time));
  const resolved = items
    .filter(i => i.state == "fixed" && i.bugData.cf_last_resolved)
    .map(i => Date.parse(i.bugData.cf_last_resolved))
    .sort((a, b) => a - b);
  let start = Math.min(now - 7 * DAY, ...created, ...resolved);
  start = Math.min(start, now - DAY);

  const x = t => pad.l + ((t - start) / (now - start)) * (W - pad.l - pad.r);
  const y = n => pad.t + (1 - n / total) * (H - pad.t - pad.b);

  let remaining = total;
  let d = `M${x(start)},${y(remaining)}`;
  for (const t of resolved) {
    d += ` H${x(t)}`;
    remaining--;
    d += ` V${y(remaining)}`;
  }
  d += ` H${x(now)}`;

  let grid = "";
  for (const n of [0, Math.round(total / 2), total]) {
    grid +=
      `<line x1="${pad.l}" x2="${W - pad.r}" y1="${y(n)}" y2="${y(n)}" stroke="var(--line)"/>` +
      `<text x="${pad.l - 6}" y="${y(n) + 4}" text-anchor="end" font-size="11" fill="var(--faint)">${n}</text>`;
  }
  const labels =
    `<text x="${pad.l}" y="${H - 6}" font-size="11" fill="var(--faint)">${fmtDate(new Date(start))}</text>` +
    `<text x="${W - pad.r}" y="${H - 6}" text-anchor="end" font-size="11" fill="var(--faint)">today</text>`;
  const area = `${d} V${y(0)} H${x(start)} Z`;

  svg.innerHTML =
    grid +
    labels +
    `<path d="${area}" fill="var(--assigned)" fill-opacity="0.08"/>` +
    `<path d="${d}" fill="none" stroke="var(--assigned)" stroke-width="2" stroke-linejoin="round"/>` +
    `<circle cx="${x(now)}" cy="${y(remaining)}" r="3.5" fill="var(--assigned)"/>` +
    `<text x="${x(now) - 8}" y="${y(remaining) - 8}" text-anchor="end" font-size="12" font-weight="600" fill="var(--fg)">${remaining} remaining</text>`;
}

function renderRow(item, firstGroup) {
  const slash = item.path.lastIndexOf("/") + 1;
  const file = `<a href="${SEARCHFOX}${esc(item.path)}"><code><span class="dir">${esc(item.path.slice(0, slash))}</span>${esc(item.path.slice(slash))}</code></a>`;
  const obj = item.object ? ` <code class="obj">${esc(item.object)}</code>` : "";
  const repeat = firstGroup ? `<div class="note">Listed above under <code>${esc(firstGroup)}</code></div>` : "";
  const note = !firstGroup && item.note ? `<div class="note">${esc(item.note)}</div>` : "";
  const b = item.bugData;
  const bug = item.bug
    ? `<a href="${BUGZILLA}/show_bug.cgi?id=${item.bug}"${b ? ` title="${esc(b.summary)}"` : ""}>bug ${item.bug}</a>`
    : `<span class="muted">not filed</span>`;
  let status;
  if (!item.bug) {
    status = `<span class="pill st-none">no bug</span>`;
  } else if (!b) {
    status = `<span class="muted">unknown</span>`;
  } else {
    status = `<span class="pill st-${item.state}">${esc(b.status)}${b.resolution ? " " + esc(b.resolution) : ""}</span>`;
  }
  const who = esc(assigneeName(b));
  const fixed = item.state == "fixed" && b.cf_last_resolved ? fmtDate(new Date(b.cf_last_resolved)) : "";
  if (firstGroup) {
    return `<tr class="repeat"><td colspan="6">${file}${obj}${repeat}</td></tr>`;
  }
  return `<tr><td>${file}${obj}${note}</td><td class="num">${item.lines.toLocaleString("en-US")}</td><td>${bug}</td><td>${status}</td><td>${who}</td><td class="date">${fixed}</td></tr>`;
}

function renderRows(groups, items) {
  const byStatus = (a, b) => SORT_ORDER[a.state] - SORT_ORDER[b.state] || b.lines - a.lines;
  let html = "";
  for (const group of groups) {
    const members = items.filter(i => i.functions.includes(group.id));
    const own = members.filter(i => i.firstGroup == group.id).sort(byStatus);
    const repeats = members.filter(i => i.firstGroup != group.id).sort(byStatus);
    const done = own.filter(i => i.state == "fixed").length;
    const bar = STATES.map(s => {
      const n = own.filter(i => i.state == s.key).length;
      return n ? `<span style="width:${(100 * n) / own.length}%;background:${s.color}"></span>` : "";
    }).join("");
    const extra = repeats.length ? ` <span class="muted">+${repeats.length} listed above</span>` : "";
    html +=
      `<tr class="group"><td colspan="6"><code>gBrowserInit.${esc(group.id)}</code>` +
      ` <span class="gcount">${done} / ${own.length}</span><span class="gbar">${bar}</span>${extra}</td></tr>`;
    html += own.map(i => renderRow(i, null)).join("");
    html += repeats.map(i => renderRow(i, i.firstGroup)).join("");
  }
  $("rows").innerHTML = html;
}

async function main() {
  const data = await (await fetch("data.json", { cache: "no-store" })).json();
  document.title = data.title;
  $("title").textContent = data.title;

  const ids = [...new Set(data.items.filter(i => i.bug).map(i => i.bug))];
  let bugs = new Map();
  try {
    bugs = await fetchBugs(ids);
  } catch (e) {
    $("error").hidden = false;
    $("error").textContent = `Could not load bug status from Bugzilla (${e.message}). Showing the tracked items without status.`;
  }

  const items = data.items.map(i => {
    const bugData = i.bug ? bugs.get(i.bug) : null;
    const firstGroup = data.groups.find(g => i.functions.includes(g.id)).id;
    return { ...i, bugData, firstGroup, state: i.bug && !bugData ? "filed" : classify(bugData) };
  });

  renderSummary(data, items);
  renderDonut(items);
  renderBurndown(items);
  renderRows(data.groups, items);
  window.addEventListener("resize", () => renderBurndown(items));

  const time = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  $("footer").textContent =
    `Updated ${time} from Bugzilla.` + (data.linesFrom ? ` Line counts from ${data.linesFrom}.` : "");
}

main().catch(e => {
  $("summary").textContent = "";
  $("error").hidden = false;
  $("error").textContent = `Failed to load the tracker: ${e.message}`;
});
</script>
</body>
</html>
