<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Name, Address & Birthday Form</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #fafafa; }
        form {
            max-width: 520px;
            margin: auto;
            padding: 20px 24px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background-color: #fff;
        }
        h2 { margin-top: 0; }
        section { margin-bottom: 20px; }
        section h3 {
            margin-bottom: 10px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 4px;
        }
        label { display: block; margin-top: 10px; font-size: 0.9em; font-weight: bold; }
        input, select {
            width: 100%;
            box-sizing: border-box;
            padding: 8px;
            margin-top: 4px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .row { display: flex; gap: 10px; }
        .row .field { flex: 1; }
        button {
            margin-top: 16px;
            padding: 10px 16px;
            background-color: #4CAF50;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
        }
        button:hover { background-color: #45a049; }
    </style>
</head>
<body>
    <form id="profileForm" action="/submit" method="POST" autocomplete="on">
        <h2>Profile Form</h2>

        <!-- Name -->
        <section>
            <h3>Name</h3>
            <div class="row">
                <div class="field">
                    <label for="givenName">First Name</label>
                    <input type="text" id="givenName" name="given-name" autocomplete="given-name" required>
                </div>
                <div class="field">
                    <label for="familyName">Last Name</label>
                    <input type="text" id="familyName" name="family-name" autocomplete="family-name" required>
                </div>
            </div>
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" name="name" autocomplete="name">
        </section>

        <!-- Address -->
        <section>
            <h3>Address</h3>
            <label for="addressLine1">Street Address</label>
            <input type="text" id="addressLine1" name="address-line1" autocomplete="address-line1" required>

            <label for="addressLine2">Apt / Suite / Unit (optional)</label>
            <input type="text" id="addressLine2" name="address-line2" autocomplete="address-line2">

            <label for="city">City</label>
            <input type="text" id="city" name="address-level2" autocomplete="address-level2" required>

            <div class="row">
                <div class="field">
                    <label for="state">State / Province</label>
                    <input type="text" id="state" name="address-level1" autocomplete="address-level1" required>
                </div>
                <div class="field">
                    <label for="postalCode">ZIP / Postal Code</label>
                    <input type="text" id="postalCode" name="postal-code" autocomplete="postal-code" required>
                </div>
            </div>

            <label for="country">Country</label>
            <input type="text" id="country" name="country-name" autocomplete="country-name" required>
        </section>

        <!-- Birthday -->
        <section>
            <h3>Birthday</h3>
            <label for="bday">Date of Birth</label>
            <input type="date" id="bday" name="bday" autocomplete="bday">

            <p style="font-size: 0.85em; color: #666; margin: 8px 0 4px;">Or enter parts separately:</p>
            <div class="row">
                <div class="field">
                    <label for="bdayMonth">Month</label>
                    <input type="number" id="bdayMonth" name="bday-month" autocomplete="bday-month" min="1" max="12" placeholder="MM">
                </div>
                <div class="field">
                    <label for="bdayDay">Day</label>
                    <input type="number" id="bdayDay" name="bday-day" autocomplete="bday-day" min="1" max="31" placeholder="DD">
                </div>
                <div class="field">
                    <label for="bdayYear">Year</label>
                    <input type="number" id="bdayYear" name="bday-year" autocomplete="bday-year" min="1900" max="2100" placeholder="YYYY">
                </div>
            </div>
        </section>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
